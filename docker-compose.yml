services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: flash_user
      POSTGRES_PASSWORD: flash_password
      POSTGRES_DB: flashdrop
    ports:
      - "5433:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  kafka:
    image: confluentinc/confluent-local:7.6.1
    ports:
      - "9092:9092"

volumes:
  pgdata: