config:
  target: 'http://localhost:3000'
  phases:
    - duration: 10
      arrivalRate: 150
      name: "Flash Sale Spike"
scenarios:
  - flow:
      - post:
          url: "/api/orders"
          headers:
            x-idempotency-key: "{{ $uuid }}"
          json:
            userId: "user_{{ $randomNumber(1,1000) }}"
            productId: "prod_1"
            quantity: 1